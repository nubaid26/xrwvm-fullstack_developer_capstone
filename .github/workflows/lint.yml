name: Lint Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python files with flake8
        run: |
          flake8 server/djangoapp/models.py server/djangoapp/admin.py server/djangoapp/populate.py server/djangoapp/restapis.py server/djangoapp/views.py server/djangoapp/urls.py server/djangoproj/urls.py --max-line-length=100

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jshint
        run: npm install -g jshint

      - name: Lint JavaScript files with jshint
        run: |
          jshint server/database/app.js
